<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>DUNGEONS OF CARAROSS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='black'/><path d='M2 14 8 2l6 12H2z' fill='none' stroke='%23e8e8e8'/></svg>" />
  <style>
    html, body {
      margin: 0; padding: 0; background: #000; height: 100%;
      overflow: hidden; font-family: monospace;
    }
    #stage {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
    }
    canvas {
      image-rendering: pixelated; image-rendering: crisp-edges;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    #cmdinput {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 28px;
      opacity: 0.01; font-size: 16px; border: none; outline: none;
      background: transparent; color: transparent; caret-color: transparent;
      z-index: 5;
    }
    #panel {
      position: fixed; top: 8px; right: 8px; color: #888; background: #111;
      border: 1px solid #333; padding: 10px; font-size: 12px; display: none;
      max-width: 320px; max-height: 90vh; overflow-y: auto; z-index: 10;
    }
    #panel h3 { margin: 6px 0 2px; color: #ccc; font-size: 12px; }
    #panel label { display: block; margin: 3px 0; }
    #panel button, #panel select { font-family: monospace; font-size: 11px; }
    #panel .credits { white-space: pre-wrap; color: #666; }
    #gear {
      position: fixed; top: 8px; right: 8px; z-index: 11; color: #444;
      background: none; border: none; font-size: 16px; cursor: pointer;
    }
    #gear:hover { color: #999; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <button id="gear" title="settings">*</button>
  <div id="panel"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
